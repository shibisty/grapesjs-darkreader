<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>grapesjs-darkreader dev</title>
  <link rel="stylesheet" href="https://unpkg.com/grapesjs@0.21.13/dist/css/grapes.min.css" />
  <style>html, body { margin: 0; height: 100%; }</style>
  <script src="https://unpkg.com/grapesjs@0.21.13/dist/grapes.min.js"></script>
  <script src="https://unpkg.com/grapesjs-preset-webpage@1.0.3/dist/index.js"></script>
</head>
<body>
  <div id="gjs"></div>
  <script type="module">
    import grapesjsDarkReader from './src/index.ts';
    window.editor = grapesjs.init({
      container: '#gjs',
      height: '100vh',
      storageManager: false,
      components: '<header style="padding:24px"><h1>Hello</h1><p>Light design, generated dark theme.</p></header>', style: 'body{background:#fff;color:#222;font-family:sans-serif}',
      plugins: ['grapesjs-preset-webpage', grapesjsDarkReader],
    });
  </script>
</body>
</html>
